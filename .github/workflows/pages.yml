# GitHub Pages 배포 — 직접 소유하는 워크플로
#
# 왜 만들었나:
#   GitHub 이 자동 생성하는 pages-build-deployment 에는 대기열 설정이 없다.
#   그래서 배포가 끝나기 전에 다음 푸시가 들어오면 큐에 서지 않고 그냥 실패한다.
#     HttpError: Deployment request failed ... due to in progress deployment
#   아래 concurrency 가 그걸 막는다. 진행 중인 배포는 끝까지 두고(cancel-in-progress: false),
#   그 사이 들어온 푸시는 마지막 것만 남겨 순서대로 처리한다.
#
# ⚠️ 쓰기 전에 저장소 설정을 바꿔야 한다:
#   Settings → Pages → Build and deployment → Source 를
#   'Deploy from a branch' → 'GitHub Actions' 로 변경.
#   (이 설정을 안 바꾸면 이 워크플로의 배포 단계가 실패한다)
#   본 저장소(Dangdong)와 테스트 저장소(Dangdong-beta) 양쪽 다 바꿔야 한다.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:     # 수동 재배포 버튼

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 건 끝까지 두고, 대기 중이던 것들은 마지막 것만 남긴다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 빌드 과정이 없는 정적 사이트라 저장소 전체를 그대로 올린다.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
